name: reproduce
on: [push, pull_request]
jobs:
  reproduce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python analysis/run_all.py
      - run: python tests/test_reproduces_paper.py
      - name: Fail if committed results differ from regenerated ones
        run: git diff --exit-code -- results/
